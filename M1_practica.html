    <p class="sub">Multiplicar es juntar grupos iguales</p>
  </div>
  <div class="head-btns">
    <a class="back-btn" href="index.html">← Misiones</a>

  <p>Tabla pitagórica: tocá un número de la tabla y mirá su fila y su columna.</p>
  <table class="ptable" id="ptable"></table>
  <div class="readout" id="readout"></div>
</section>

<nav class="levels" id="levels"></nav>

<main class="card" id="card"></main>

</div>

<script src="practica.js"></script>
<script>
const THINGS = [
  { em: '🍪', one: 'galletita', many: 'galletitas', box: 'plato', boxes: 'platos', kind: '' },
  { em: '🍓', one: 'frutilla', many: 'frutillas', box: 'plato', boxes: 'platos', kind: '' },
  { em: '🍬', one: 'caramelo', many: 'caramelos', box: 'bolsa', boxes: 'bolsas', kind: 'bolsa' },
  { em: '⚽', one: 'pelota', many: 'pelotas', box: 'caja', boxes: 'cajas', kind: 'box' },
  { em: '🖍️', one: 'crayón', many: 'crayones', box: 'caja', boxes: 'cajas', kind: 'box' },
  { em: '🌸', one: 'flor', many: 'flores', box: 'maceta', boxes: 'macetas', kind: 'bolsa' },
];

// ---------- question makers ----------
// Every question: { prompt, pic?, kind: 'mult'|'num'|'choice'|'multi'|'opnum', ..., why, hint, hintPic? }
function qGroups(i) {
  const small = i < 2;
  const g = small ? rnd(2, 3) : rnd(3, 5), e = small ? rnd(2, 3) : rnd(3, 5);
  const th = pick(THINGS);
  return {
    kind: 'mult', g, e,
    prompt: `Hay ${g} ${th.boxes} con ${e} ${th.many} en cada ${th.box === 'maceta' || th.box === 'bolsa' || th.box === 'caja' ? 'una' : 'uno'}. Escribí la multiplicación.`,
    pic: () => groupsPic(g, e, th),
    labels: [th.boxes, `en cada ${th.box}`],
    hint: `Primero contá cuántos ${th.boxes} hay. Después, cuántas cosas hay en un solo ${th.box}.`,
    why: `${g} grupos de ${e}: ${g} × ${e} = ${g * e}`,
  };
}
function qSumToMult(i) {
  const g = i < 2 ? rnd(2, 3) : rnd(4, 6), e = i < 2 ? rnd(2, 4) : pick([5, 6, 7, 8, 10]);
  const th = pick(THINGS);
  return {
    kind: 'mult', g, e,
    prompt: `Escribí esta suma como una multiplicación:<br><span class="big">${repSum(e, g)}</span>`,
    labels: ['veces', 'el número que se repite'],
    hint: `Contá cuántas veces aparece el ${e}.`,
    hintPic: () => trayPic(g, e, '🔵'),
    why: `El ${e} aparece ${g} veces: ${g} × ${e} = ${g * e}`,
  };
}
function qMultToSum(i) {
  const g = i < 2 ? rnd(2, 3) : rnd(3, 5), e = i < 2 ? rnd(2, 5) : rnd(4, 9);
  const opts = [
    { t: repSum(e, g), ok: true },
    { t: `${g} + ${e}`, ok: false },
    { t: repSum(e, g + 1), ok: false },
  ];
  if (g > 2) opts.push({ t: repSum(e, g - 1), ok: false });
  return {
    kind: 'choice',
    prompt: `¿Qué suma es lo mismo que <span class="big">${g} × ${e}</span>?`,
    options: shuffle(opts),
    hint: `${g} × ${e} quiere decir “${g} veces ${e}”: el ${e} tiene que aparecer ${g} veces.`,
    why: `${g} × ${e} es ${g} veces ${e}: ${repSum(e, g)} = ${g * e}`,
  };
}
function qTray(i) {
  const r = i < 2 ? rnd(2, 3) : rnd(3, 5), c = i < 2 ? rnd(3, 4) : rnd(5, 8);
  const em = pick(['🥐', '🧁', '🍩']);
  return {
    kind: 'mult', g: r, e: c,
    prompt: `Una bandeja con ${r} filas iguales. ¿Cuántos hay en total? Escribí la multiplicación.`,
    pic: () => trayPic(r, c, em),
    labels: ['filas', 'en cada fila'],
    hint: 'Contá las filas (de arriba hacia abajo). Después contá cuántos hay en una sola fila.',
    why: `${r} filas de ${c}: ${r} × ${c} = ${r * c}`,
  };
}
function qTrayMore(i, byRow) {
  const r = rnd(3, 5), c = rnd(5, 8), em = '🥐', P = r * c;
  if (byRow) return {
    kind: 'num', answer: P + c,
    prompt: `En la bandeja hay ${r} filas de ${c}: <b>${r} × ${c} = ${P}</b>.<br>Si agregamos <b>una fila más</b>, igual a las otras, ¿cuántas medialunas hay?`,
    pic: () => trayPic(r, c, em),
    hint: `La fila nueva tiene ${c} medialunas. Ahora son ${r + 1} filas de ${c}.`,
    hintPic: () => trayPic(r, c, em, true, false),
    why: `${r + 1} × ${c} = ${P + c}. Es lo mismo que ${P} + ${c}.`,
  };
  return {
    kind: 'num', answer: P + r,
    prompt: `En la bandeja hay ${r} filas de ${c}: <b>${r} × ${c} = ${P}</b>.<br>Si agregamos <b>una medialuna más en cada fila</b>, ¿cuántas hay?`,
    pic: () => trayPic(r, c, em),
    hint: `Siguen siendo ${r} filas, pero ahora de ${c + 1}. Agregaste ${r} medialunas.`,
    hintPic: () => trayPic(r, c, em, false, true),
    why: `${r} × ${c + 1} = ${P + r}. Es lo mismo que ${P} + ${r}.`,
  };
}

const PROBLEMS = {
  mult: [
    (a, b) => [`Hay ${a} cajas con ${b} lápices cada una. ¿Cuántos lápices hay?`, 'lápices'],
    (a, b) => [`Mamá compró ${a} paquetes de ${b} caramelos cada uno. ¿Cuántos caramelos compró?`, 'caramelos'],
    (a, b) => [`En el aula hay ${a} filas de bancos, con ${b} bancos en cada fila. ¿Cuántos bancos hay?`, 'bancos'],
    (a, b) => [`Cada auto tiene 4 ruedas. ¿Cuántas ruedas tienen ${a} autos?`, 'ruedas', 4],
    (a, b) => [`En una huerta hay ${a} surcos con ${b} plantines cada uno. ¿Cuántos plantines hay?`, 'plantines'],
  ],
  add: [
    (a, b) => [`Juan tenía ${a} figuritas y su abuela le regaló ${b}. ¿Cuántas tiene ahora?`, 'figuritas'],
    (a, b) => [`En un estante hay ${a} libros y en otro hay ${b}. ¿Cuántos libros hay en los dos?`, 'libros'],
  ],
};
function qProblem(i) {
  // order: easy ×, +, ×, combinations, harder ×
  if (i === 3) {
    const a = rnd(2, 4), b = rnd(2, 3);
    const tops = ['remera roja', 'remera azul', 'remera verde', 'remera blanca'].slice(0, a);
    const bots = ['pantalón azul', 'pantalón negro', 'pantalón gris'].slice(0, b);
    return {
      kind: 'opnum', a, b, op: '×', answer: a * b,
      prompt: `Sofi tiene ${a} remeras y ${b} pantalones. ¿De cuántas maneras distintas puede combinar una remera con un pantalón?`,
      hint: `Cada remera se puede usar con ${b} pantalones distintos. Son grupos iguales.`,
      hintPic: () => treePic(tops, bots),
      why: `${a} remeras, y cada una con ${b} opciones: ${a} × ${b} = ${a * b} maneras.`,
    };
  }
  if (i === 1) {
    const a = rnd(12, 30), b = rnd(5, 15);
    const [txt] = pick(PROBLEMS.add)(a, b);
    return {
      kind: 'opnum', a, b, op: '+', answer: a + b, prompt: txt,
      hint: 'Fijate si hay grupos iguales. Si solo se juntan dos cantidades distintas, es una suma.',
      why: `No hay grupos iguales: se juntan ${a} y ${b}. ${a} + ${b} = ${a + b}`,
    };
  }
  const big = i === 4;
  let a = big ? rnd(6, 9) : rnd(2, 4), b = big ? rnd(6, 9) : rnd(3, 5);
  let [txt, unit, fixed] = pick(PROBLEMS.mult)(a, b);
  if (fixed) b = fixed;
  return {
    kind: 'opnum', a, b, op: '×', answer: a * b, prompt: txt,
    hint: 'Buscá las palabras “cada uno”, “cada una” o “en cada fila”: ahí hay grupos iguales.',
    hintPic: () => trayPic(a, b, '🔵'),
    why: `${a} grupos iguales de ${b}: ${a} × ${b} = ${a * b} ${unit}.`,
  };
}
function qWhich(i) {
  const g = rnd(3, 5);
  let e = rnd(2, 6);
  if (e === g) e = g === 5 ? 6 : g + 1;   // 4 × 4 would show two identical options
  const th = pick(THINGS);
  const opts = [
    { t: `${g} × ${e}`, ok: true },
    { t: `${e} × ${g}`, ok: true },
    { t: repSum(e, g), ok: true },
    { t: `${g} + ${e}`, ok: false },
    { t: repSum(e, g - 1), ok: false },
    { t: `${g} × ${e + 1}`, ok: false },
  ];
  return {
    kind: 'multi',
    prompt: `${g} ${th.boxes} con ${e} ${th.many} en cada ${th.box}. ¿Qué cálculos sirven para saber cuántas hay? <br><small>Puede haber más de uno.</small>`,
    pic: () => groupsPic(g, e, th),
    options: shuffle(opts),
    hint: `Sirve todo lo que cuente ${g} grupos de ${e}. Acordate: el orden de la multiplicación no cambia el resultado.`,
    why: `Sirven ${g} × ${e}, ${e} × ${g} y ${repSum(e, g)}. Todos dan ${g * e}.`,
  };
}
function qMoreLess() {
  const cases = [];
  for (let a = 2; a <= 9; a++) for (let b = 2; b <= 10; b++) for (const n of [10, 20, 30, 50]) {
    const p = a * b;
    if (Math.abs(p - n) >= 3 && Math.abs(p - n) <= 12) cases.push([a, b, n]);
  }
  const [a, b, n] = pick(cases), p = a * b, more = p > n;
  return {
    kind: 'choice',
    prompt: `Sin hacer la cuenta exacta: ¿<span class="big">${a} × ${b}</span> da más o menos que ${n}?`,
    options: [{ t: `Más que ${n}`, ok: more }, { t: `Menos que ${n}`, ok: !more }],
    hint: `Pensá en una multiplicación parecida que sepas, con números redondos. Por ejemplo, ${a} × ${b > 5 ? 10 : 5}.`,
    why: `${a} × ${b} = ${p}, que es ${more ? 'más' : 'menos'} que ${n}.`,
  };
}

const MISSION_LEVELS = [
  { name: 'Contá los grupos', make: i => qGroups(i) },
  { name: 'Sumas que se repiten', make: i => (i % 2 === 0 ? qSumToMult(i) : qMultToSum(i)) },
  { name: 'Filas', make: i => (i < 3 ? qTray(i) : qTrayMore(i, i === 3)) },
  { name: 'Problemas', make: i => qProblem(i) },
  { name: 'Desafío', make: i => (i < 3 ? qWhich(i) : qMoreLess()) },
];

startPractice({ key: 'mision1-practica', levels: MISSION_LEVELS });
</script>
