<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Práctica Misión 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: night-sky page like the study guide and the video. Header (mascot + title + video button),
   level pills, then one paper card that shows a single question at a time with picture, answer, feedback. */
:root {
  --sky: #1b2547;
  --sky-2: #26335f;
  --star: #f2b33d;
  --star-soft: #f7d58c;
  --paper: #fbf8f1;
  --paper-2: #f1ecdf;
  --ink: #23263a;
  --ink-2: #555a75;
  --muted: #aab4d8;
  --good: #3f9c55;
  --good-soft: #dff2e3;
  --bad: #d4513d;
  --bad-soft: #fbe3de;
  --a: #4a7bd8;
  --a-soft: #dbe6fa;
  --b: #e08a2c;
  --b-soft: #fbe7cf;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--sky);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 72%, #ffffff88 50%, transparent 51%),
    radial-gradient(2px 2px at 58% 12%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1px 1px at 81% 44%, #ffffff77 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 92% 86%, #ffffff99 50%, transparent 51%);
  background-size: 420px 420px;
  color: var(--paper);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 56px; display: grid; gap: 18px; }
header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.mascot { width: 72px; height: 72px; transition: transform .3s; }
.mascot.jump { animation: jump .7s ease; }
@keyframes jump { 30% { transform: translateY(-16px) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg); } }
h1 { font-family: var(--display); font-size: clamp(1.4rem, 4.5vw, 2rem); margin: 0; line-height: 1.1; }
h1 mark { background: var(--star); color: var(--ink); padding: 0 .2em; border-radius: 6px; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }

button {
  font: 600 1.05rem var(--display); border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer;
  background: var(--sky); color: var(--paper); min-height: 46px;
}
button.alt { background: var(--paper-2); color: var(--ink); }
button.go { background: var(--good); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
.video-btn { background: var(--star); color: var(--ink); white-space: nowrap; }

.video-box { display: none; background: #000; border-radius: 18px; overflow: hidden; }
.video-box.open { display: block; }
.video-box video { width: 100%; display: block; }
.head-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
@media (max-width: 600px) {
  .head-btns { grid-column: 1 / -1; justify-content: stretch; }
  .head-btns button { flex: 1; }
}
.table-btn { background: var(--a-soft); color: var(--ink); white-space: nowrap; }
.back-btn { font: 600 1.05rem var(--display); background: var(--sky-2); color: var(--muted); text-decoration: none; border-radius: 999px; padding: 10px 18px; display: inline-grid; place-items: center; min-height: 46px; white-space: nowrap; }
@media (max-width: 600px) { .back-btn { flex: 1; } }

/* tabla pitagórica: tap a number to see its row and column */
.ptable-box { display: none; background: var(--paper); color: var(--ink); border-radius: 22px; padding: 16px; gap: 10px; justify-items: center; }
.ptable-box.open { display: grid; }
.ptable-box p { margin: 0; font-weight: 800; text-align: center; }
.ptable-box .readout { font: 600 clamp(1.1rem, 4.5vw, 1.6rem) var(--display); text-align: center; min-height: 1.4em; }
.ptable-box .readout b { color: var(--a); }
.ptable-box .readout i { color: var(--b); font-style: normal; }
.ptable-box .readout em { color: var(--good); font-style: normal; }
.ptable { border-collapse: separate; border-spacing: 2px; font-family: var(--display); font-weight: 600; font-size: clamp(.7rem, 2.6vw, 1rem); }
.ptable td { width: clamp(24px, 7.6vw, 40px); height: clamp(24px, 7.6vw, 36px); text-align: center; border-radius: 6px; cursor: pointer; background: #fff; }
.ptable tr:first-child td, .ptable td:first-child { background: var(--paper-2); color: var(--ink-2); }
.ptable td.row { background: var(--a-soft); }
.ptable td.col { background: var(--b-soft); }
.ptable td.rh { background: var(--a); color: #fff; }
.ptable td.ch { background: var(--b); color: #fff; }
.ptable td.hit { background: var(--good); color: #fff; }

.levels { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.lvl {
  flex: none; background: var(--sky-2); color: var(--paper); border: 2px solid transparent;
  border-radius: 16px; padding: 8px 14px; text-align: left; min-height: 0; display: grid; gap: 2px;
}
.lvl small { font-family: var(--body); font-weight: 800; color: var(--muted); font-size: .75rem; }
.lvl .stars { color: var(--star); letter-spacing: 2px; font-size: .9rem; }
.lvl.on { border-color: var(--star); background: var(--paper); color: var(--ink); }
.lvl.on small { color: var(--ink-2); }

.card { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 20px clamp(16px, 4vw, 30px) 24px; display: grid; gap: 16px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-top h2 { font-family: var(--display); margin: 0; font-size: 1.3rem; }
.dots { display: flex; gap: 6px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--paper-2); }
.dots span.now { background: var(--star); }
.dots span.ok { background: var(--good); }
.dots span.meh { background: var(--b); }

.prompt { font-size: 1.25rem; font-weight: 800; }
.prompt .big { font-family: var(--display); font-size: 1.7rem; font-weight: 600; }
.pic { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.bag { border: 3px solid #bab4a8; background: #ece8e0; border-radius: 50%; min-width: 92px; min-height: 92px; padding: 14px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; align-content: center; max-width: 130px; font-size: 1.45rem; line-height: 1; }
.bag.box { border-radius: 10px; border-color: var(--b); background: var(--b-soft); }
.bag.bolsa { border-radius: 18px 18px 30px 30px; border-color: var(--a); background: var(--a-soft); }

.tray { display: inline-grid; gap: 4px; padding: 10px; background: #d8dde9; border: 4px solid #a0a8be; border-radius: 16px; font-size: 1.6rem; line-height: 1; }
.tray span { width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 8px; }
.tray span.new { background: var(--good-soft); }

.tree { display: grid; gap: 6px; font-weight: 800; }
.tree div { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tree .r { background: var(--a-soft); color: var(--a); border-radius: 10px; padding: 3px 10px; }
.tree .l { background: var(--b-soft); color: #9a5a12; border-radius: 10px; padding: 3px 10px; }

.answer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-family: var(--display); font-size: 1.8rem; }
.answer input {
  width: 3.2ch; min-width: 76px; font: 600 1.8rem var(--display); text-align: center; color: var(--ink);
  border: 3px solid var(--paper-2); border-radius: 14px; padding: 6px; background: #fff;
}
.answer input:focus { outline: none; border-color: var(--a); }
.answer input.right { border-color: var(--good); background: var(--good-soft); }
.answer input.wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer .lbl { font-family: var(--body); font-size: .85rem; color: var(--ink-2); display: block; text-align: center; font-weight: 800; }
.answer label { display: grid; gap: 2px; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.choice {
  background: #fff; color: var(--ink); border: 3px solid var(--paper-2); border-radius: 16px;
  font: 600 1.35rem var(--display); padding: 12px; min-height: 64px;
}
.choice:hover:not(:disabled) { border-color: var(--a); }
.choice.sel { border-color: var(--a); background: var(--a-soft); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.missed { border-color: var(--good); border-style: dashed; }
.note { text-align: center; color: var(--ink-2); font-weight: 800; font-size: .95rem; }

.feedback { border-radius: 14px; padding: 12px 16px; font-weight: 800; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.feedback.info { background: var(--star-soft); color: var(--ink); }
.feedback .why { display: block; color: var(--ink); font-weight: 600; margin-top: 4px; }

.hint { display: none; background: var(--a-soft); border-radius: 14px; padding: 12px 16px; gap: 10px; }
.hint.show { display: grid; }
.hint p { margin: 0; font-weight: 800; color: var(--a); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.actions .right-side { display: flex; gap: 10px; margin-left: auto; }

.done { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 10px 0; }
.done .big-stars { font-size: 3rem; color: var(--star); letter-spacing: 6px; }
.done h2 { font-family: var(--display); margin: 0; font-size: 1.8rem; }
</style>
</head>

<script>
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const repSum = (n, times) => Array(times).fill(n).join(' + ');
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

const THINGS = [
  { em: '🍪', one: 'galletita', many: 'galletitas', box: 'plato', boxes: 'platos', kind: '' },
  { em: '🍓', one: 'frutilla', many: 'frutillas', box: 'plato', boxes: 'platos', kind: '' },
  { em: '🍬', one: 'caramelo', many: 'caramelos', box: 'bolsa', boxes: 'bolsas', kind: 'bolsa' },
  { em: '⚽', one: 'pelota', many: 'pelotas', box: 'caja', boxes: 'cajas', kind: 'box' },
  { em: '🖍️', one: 'crayón', many: 'crayones', box: 'caja', boxes: 'cajas', kind: 'box' },
  { em: '🌸', one: 'flor', many: 'flores', box: 'maceta', boxes: 'macetas', kind: 'bolsa' },
];

function groupsPic(g, e, th) {
  const wrap = h('div', 'pic');
  for (let i = 0; i < g; i++) wrap.appendChild(h('div', 'bag ' + th.kind, th.em.repeat(e)));
  return wrap;
}
function trayPic(r, c, em, newRow = false, newCol = false) {
  const rows = r + (newRow ? 1 : 0), cols = c + (newCol ? 1 : 0);
  const t = h('div', 'tray');
  t.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const isNew = (newRow && i === r) || (newCol && j === c);
    t.appendChild(h('span', isNew ? 'new' : '', em));
  }
  const w = h('div', 'pic'); w.appendChild(t); return w;
}
function treePic(left, right) {
  const t = h('div', 'tree');
  left.forEach(a => {
    const row = h('div');
    row.appendChild(h('span', 'r', a));
    right.forEach(b => row.appendChild(h('span', 'l', b)));
    t.appendChild(row);
  });
  return t;
}

// ---------- question makers ----------
// Every question: { prompt, pic?, kind: 'mult'|'num'|'choice'|'multi'|'opnum', ..., why, hint, hintPic? }
function qGroups(i) {
  const small = i < 2;
  const g = small ? rnd(2, 3) : rnd(3, 5), e = small ? rnd(2, 3) : rnd(3, 5);
  const th = pick(THINGS);
  return {
    kind: 'mult', g, e,
    prompt: `Hay ${g} ${th.boxes} con ${e} ${th.many} en cada ${th.box === 'maceta' || th.box === 'bolsa' || th.box === 'caja' ? 'una' : 'uno'}. Escribí la multiplicación.`,
    pic: () => groupsPic(g, e, th),
    labels: [th.boxes, `en cada ${th.box}`],
    hint: `Primero contá cuántos ${th.boxes} hay. Después, cuántas cosas hay en un solo ${th.box}.`,
    why: `${g} grupos de ${e}: ${g} × ${e} = ${g * e}`,
  };
}
function qSumToMult(i) {
  const g = i < 2 ? rnd(2, 3) : rnd(4, 6), e = i < 2 ? rnd(2, 4) : pick([5, 6, 7, 8, 10]);
  const th = pick(THINGS);
  return {
    kind: 'mult', g, e,
    prompt: `Escribí esta suma como una multiplicación:<br><span class="big">${repSum(e, g)}</span>`,
    labels: ['veces', 'el número que se repite'],
    hint: `Contá cuántas veces aparece el ${e}.`,
    hintPic: () => trayPic(g, e, '🔵'),
    why: `El ${e} aparece ${g} veces: ${g} × ${e} = ${g * e}`,
  };
}
function qMultToSum(i) {
  const g = i < 2 ? rnd(2, 3) : rnd(3, 5), e = i < 2 ? rnd(2, 5) : rnd(4, 9);
  const opts = [
    { t: repSum(e, g), ok: true },
    { t: `${g} + ${e}`, ok: false },
    { t: repSum(e, g + 1), ok: false },
  ];
  if (g > 2) opts.push({ t: repSum(e, g - 1), ok: false });
  return {
    kind: 'choice',
    prompt: `¿Qué suma es lo mismo que <span class="big">${g} × ${e}</span>?`,
    options: shuffle(opts),
    hint: `${g} × ${e} quiere decir “${g} veces ${e}”: el ${e} tiene que aparecer ${g} veces.`,
    why: `${g} × ${e} es ${g} veces ${e}: ${repSum(e, g)} = ${g * e}`,
  };
}
function qTray(i) {
  const r = i < 2 ? rnd(2, 3) : rnd(3, 5), c = i < 2 ? rnd(3, 4) : rnd(5, 8);
  const em = pick(['🥐', '🧁', '🍩']);
  return {
    kind: 'mult', g: r, e: c,
    prompt: `Una bandeja con ${r} filas iguales. ¿Cuántos hay en total? Escribí la multiplicación.`,
    pic: () => trayPic(r, c, em),
    labels: ['filas', 'en cada fila'],
    hint: 'Contá las filas (de arriba hacia abajo). Después contá cuántos hay en una sola fila.',
    why: `${r} filas de ${c}: ${r} × ${c} = ${r * c}`,
  };
}
function qTrayMore(i, byRow) {
  const r = rnd(3, 5), c = rnd(5, 8), em = '🥐', P = r * c;
  if (byRow) return {
    kind: 'num', answer: P + c,
    prompt: `En la bandeja hay ${r} filas de ${c}: <b>${r} × ${c} = ${P}</b>.<br>Si agregamos <b>una fila más</b>, igual a las otras, ¿cuántas medialunas hay?`,
    pic: () => trayPic(r, c, em),
    hint: `La fila nueva tiene ${c} medialunas. Ahora son ${r + 1} filas de ${c}.`,
    hintPic: () => trayPic(r, c, em, true, false),
    why: `${r + 1} × ${c} = ${P + c}. Es lo mismo que ${P} + ${c}.`,
  };
  return {
    kind: 'num', answer: P + r,
    prompt: `En la bandeja hay ${r} filas de ${c}: <b>${r} × ${c} = ${P}</b>.<br>Si agregamos <b>una medialuna más en cada fila</b>, ¿cuántas hay?`,
    pic: () => trayPic(r, c, em),
    hint: `Siguen siendo ${r} filas, pero ahora de ${c + 1}. Agregaste ${r} medialunas.`,
    hintPic: () => trayPic(r, c, em, false, true),
    why: `${r} × ${c + 1} = ${P + r}. Es lo mismo que ${P} + ${r}.`,
  };
}

const PROBLEMS = {
  mult: [
    (a, b) => [`Hay ${a} cajas con ${b} lápices cada una. ¿Cuántos lápices hay?`, 'lápices'],
    (a, b) => [`Mamá compró ${a} paquetes de ${b} caramelos cada uno. ¿Cuántos caramelos compró?`, 'caramelos'],
    (a, b) => [`En el aula hay ${a} filas de bancos, con ${b} bancos en cada fila. ¿Cuántos bancos hay?`, 'bancos'],
    (a, b) => [`Cada auto tiene 4 ruedas. ¿Cuántas ruedas tienen ${a} autos?`, 'ruedas', 4],
    (a, b) => [`En una huerta hay ${a} surcos con ${b} plantines cada uno. ¿Cuántos plantines hay?`, 'plantines'],
  ],
  add: [
    (a, b) => [`Juan tenía ${a} figuritas y su abuela le regaló ${b}. ¿Cuántas tiene ahora?`, 'figuritas'],
    (a, b) => [`En un estante hay ${a} libros y en otro hay ${b}. ¿Cuántos libros hay en los dos?`, 'libros'],
  ],
};
function qProblem(i) {
  // order: easy ×, +, ×, combinations, harder ×
  if (i === 3) {
    const a = rnd(2, 4), b = rnd(2, 3);
    const tops = ['remera roja', 'remera azul', 'remera verde', 'remera blanca'].slice(0, a);
    const bots = ['pantalón azul', 'pantalón negro', 'pantalón gris'].slice(0, b);
    return {
      kind: 'opnum', a, b, op: '×', answer: a * b,
      prompt: `Sofi tiene ${a} remeras y ${b} pantalones. ¿De cuántas maneras distintas puede combinar una remera con un pantalón?`,
      hint: `Cada remera se puede usar con ${b} pantalones distintos. Son grupos iguales.`,
      hintPic: () => treePic(tops, bots),
      why: `${a} remeras, y cada una con ${b} opciones: ${a} × ${b} = ${a * b} maneras.`,
    };
  }
  if (i === 1) {
    const a = rnd(12, 30), b = rnd(5, 15);
    const [txt] = pick(PROBLEMS.add)(a, b);
    return {
      kind: 'opnum', a, b, op: '+', answer: a + b, prompt: txt,
      hint: 'Fijate si hay grupos iguales. Si solo se juntan dos cantidades distintas, es una suma.',
      why: `No hay grupos iguales: se juntan ${a} y ${b}. ${a} + ${b} = ${a + b}`,
    };
  }
  const big = i === 4;
  let a = big ? rnd(6, 9) : rnd(2, 4), b = big ? rnd(6, 9) : rnd(3, 5);
  let [txt, unit, fixed] = pick(PROBLEMS.mult)(a, b);
  if (fixed) b = fixed;
  return {
    kind: 'opnum', a, b, op: '×', answer: a * b, prompt: txt,
    hint: 'Buscá las palabras “cada uno”, “cada una” o “en cada fila”: ahí hay grupos iguales.',
    hintPic: () => trayPic(a, b, '🔵'),
    why: `${a} grupos iguales de ${b}: ${a} × ${b} = ${a * b} ${unit}.`,
  };
}
function qWhich(i) {
  const g = rnd(3, 5);
  let e = rnd(2, 6);
  if (e === g) e = g === 5 ? 6 : g + 1;   // 4 × 4 would show two identical options
  const th = pick(THINGS);
  const opts = [
    { t: `${g} × ${e}`, ok: true },
    { t: `${e} × ${g}`, ok: true },
    { t: repSum(e, g), ok: true },
    { t: `${g} + ${e}`, ok: false },
    { t: repSum(e, g - 1), ok: false },
    { t: `${g} × ${e + 1}`, ok: false },
  ];
  return {
    kind: 'multi',
    prompt: `${g} ${th.boxes} con ${e} ${th.many} en cada ${th.box}. ¿Qué cálculos sirven para saber cuántas hay? <br><small>Puede haber más de uno.</small>`,
    pic: () => groupsPic(g, e, th),
    options: shuffle(opts),
    hint: `Sirve todo lo que cuente ${g} grupos de ${e}. Acordate: el orden de la multiplicación no cambia el resultado.`,
    why: `Sirven ${g} × ${e}, ${e} × ${g} y ${repSum(e, g)}. Todos dan ${g * e}.`,
  };
}
function qMoreLess() {
  const cases = [];
  for (let a = 2; a <= 9; a++) for (let b = 2; b <= 10; b++) for (const n of [10, 20, 30, 50]) {
    const p = a * b;
    if (Math.abs(p - n) >= 3 && Math.abs(p - n) <= 12) cases.push([a, b, n]);
  }
  const [a, b, n] = pick(cases), p = a * b, more = p > n;
  return {
    kind: 'choice',
    prompt: `Sin hacer la cuenta exacta: ¿<span class="big">${a} × ${b}</span> da más o menos que ${n}?`,
    options: [{ t: `Más que ${n}`, ok: more }, { t: `Menos que ${n}`, ok: !more }],
    hint: `Pensá en una multiplicación parecida que sepas, con números redondos. Por ejemplo, ${a} × ${b > 5 ? 10 : 5}.`,
    why: `${a} × ${b} = ${p}, que es ${more ? 'más' : 'menos'} que ${n}.`,
  };
}

const LEVELS = [
  { name: 'Contá los grupos', make: i => qGroups(i) },
  { name: 'Sumas que se repiten', make: i => (i % 2 === 0 ? qSumToMult(i) : qMultToSum(i)) },
  { name: 'Filas', make: i => (i < 3 ? qTray(i) : qTrayMore(i, i === 3)) },
  { name: 'Problemas', make: i => qProblem(i) },
  { name: 'Desafío', make: i => (i < 3 ? qWhich(i) : qMoreLess()) },
];
const PER_LEVEL = 5;

// ---------- state ----------
const KEY = 'mision1-practica';
let best = {};
try { best = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { best = {}; }
const saveBest = () => { try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (e) {} };

let level = 0, idx = 0, results = [], q = null, tries = 0, finished = false;

function starsFor(res) {
  const ok = res.filter(r => r === 'ok').length;
  return ok === PER_LEVEL ? 3 : ok >= 3 ? 2 : 1;
}

function drawLevels() {
  const nav = $('#levels'); nav.innerHTML = '';
  LEVELS.forEach((L, k) => {
    const b = h('button', 'lvl' + (k === level ? ' on' : ''));
    const s = best[k] || 0;
    b.innerHTML = `<small>Nivel ${k + 1}</small>${L.name}<span class="stars">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</span>`;
    b.onclick = () => startLevel(k);
    nav.appendChild(b);
  });
  const on = $('.lvl.on', nav);
  if (on) nav.scrollTo({ left: on.offsetLeft - 16, behavior: 'smooth' });
}

function startLevel(k) {
  level = k; idx = 0; results = []; seen = new Set();
  drawLevels();
  nextQuestion();
}

let seen = new Set();
function nextQuestion() {
  for (let k = 0; k < 20; k++) {   // avoid repeating a question inside one level
    q = LEVELS[level].make(idx);
    if (!seen.has(q.prompt)) break;
  }
  seen.add(q.prompt); tries = 0; finished = false;
  render();
}

// ---------- render one question ----------
function render() {
  const card = $('#card'); card.innerHTML = '';
  const top = h('div', 'card-top');
  top.appendChild(h('h2', '', `Nivel ${level + 1}: ${LEVELS[level].name}`));
  const dots = h('div', 'dots');
  for (let k = 0; k < PER_LEVEL; k++) {
    const r = results[k];
    dots.appendChild(h('span', r === 'ok' ? 'ok' : r ? 'meh' : (k === idx ? 'now' : '')));
  }
  top.appendChild(dots);
  card.appendChild(top);

  card.appendChild(h('div', 'prompt', q.prompt));
  if (q.pic) card.appendChild(q.pic());

  const area = h('div'); area.id = 'area';
  card.appendChild(area);
  buildAnswer(area);

  const hint = h('div', 'hint'); hint.id = 'hint';
  hint.appendChild(h('p', '', '💡 ' + q.hint));
  if (q.hintPic) hint.appendChild(q.hintPic());
  card.appendChild(hint);

  const fb = h('div', 'feedback'); fb.id = 'fb'; card.appendChild(fb);

  const act = h('div', 'actions');
  const hb = h('button', 'alt', '💡 Pista'); hb.id = 'hintBtn';
  hb.onclick = () => { hint.classList.add('show'); hb.disabled = true; };
  act.appendChild(hb);
  const rs = h('div', 'right-side');
  const cb = h('button', 'go', 'Comprobar'); cb.id = 'checkBtn'; cb.onclick = check;
  const nb = h('button', '', 'Siguiente →'); nb.id = 'nextBtn'; nb.style.display = 'none';
  nb.onclick = () => { idx++; idx < PER_LEVEL ? nextQuestion() : levelDone(); };
  rs.appendChild(cb); rs.appendChild(nb);
  act.appendChild(rs);
  card.appendChild(act);

  const first = card.querySelector('input');
  if (first && matchMedia('(pointer: fine)').matches) first.focus();
}

function numInput(id, label) {
  const lab = h('label');
  const inp = h('input'); inp.id = id; inp.type = 'text'; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!finished) check(); else $('#nextBtn').click(); } });
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 4); inp.classList.remove('wrong', 'right'); });
  lab.appendChild(inp);
  if (label) lab.appendChild(h('span', 'lbl', label));
  return lab;
}

function buildAnswer(area) {
  area.className = '';
  if (q.kind === 'mult') {
    const a = h('div', 'answer');
    a.appendChild(numInput('f1', q.labels && q.labels[0]));
    a.appendChild(h('span', '', '×'));
    a.appendChild(numInput('f2', q.labels && q.labels[1]));
    a.appendChild(h('span', '', '='));
    a.appendChild(numInput('res', 'total'));
    area.appendChild(a);
  } else if (q.kind === 'num') {
    const a = h('div', 'answer');
    a.appendChild(numInput('res', 'total'));
    area.appendChild(a);
  } else if (q.kind === 'choice' || q.kind === 'multi') {
    const c = h('div', 'choices');
    q.options.forEach((o, k) => {
      const b = h('button', 'choice', o.t); b.dataset.k = k;
      b.onclick = () => {
        if (finished) return;
        if (q.kind === 'choice') { c.querySelectorAll('.choice').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); check(); }
        else b.classList.toggle('sel');
      };
      c.appendChild(b);
    });
    area.appendChild(c);
    if (q.kind === 'multi') area.appendChild(h('p', 'note', 'Tocá todos los que sirven y después “Comprobar”.'));
  } else if (q.kind === 'opnum') {
    area.appendChild(h('p', 'note', 'Primero: ¿qué cálculo resuelve el problema?'));
    const c = h('div', 'choices');
    const ops = shuffle([{ t: `${q.a} × ${q.b}`, op: '×' }, { t: `${q.a} + ${q.b}`, op: '+' }]);
    ops.forEach(o => {
      const b = h('button', 'choice', o.t);
      b.onclick = () => {
        if (q.opDone || finished) return;
        if (o.op === q.op) {
          b.classList.add('right'); q.opDone = true;
          c.querySelectorAll('.choice').forEach(x => x.disabled = true);
          const a = h('div', 'answer');
          a.appendChild(h('span', '', `${q.a} ${q.op} ${q.b} =`));
          a.appendChild(numInput('res', ''));
          area.appendChild(a);
          $('#res').focus();
          showFb('info', '¡Bien elegido! Ahora calculá el resultado.');
        } else {
          b.classList.add('wrong'); b.disabled = true; q.opMiss = true;
          showFb('no', 'Mmm, ese no. Leé otra vez: ¿hay grupos iguales?');
        }
      };
      c.appendChild(b);
    });
    area.appendChild(c);
  }
}

function showFb(kind, msg, why) {
  const fb = $('#fb');
  fb.className = 'feedback show ' + kind;
  fb.innerHTML = msg + (why ? `<span class="why">${why}</span>` : '');
}

function val(id) { const e = $('#' + id); return e && e.value !== '' ? +e.value : null; }

function check() {
  if (finished) return;
  let ok = false, partial = '';
  if (q.kind === 'mult') {
    const a = val('f1'), b = val('f2'), r = val('res');
    if (a == null || b == null || r == null) { showFb('info', 'Completá los tres casilleros.'); return; }
    const factorsOk = (a === q.g && b === q.e) || (a === q.e && b === q.g);
    const resOk = r === q.g * q.e;
    $('#f1').classList.add(factorsOk ? 'right' : 'wrong');
    $('#f2').classList.add(factorsOk ? 'right' : 'wrong');
    $('#res').classList.add(resOk ? 'right' : 'wrong');
    ok = factorsOk && resOk;
    partial = !factorsOk ? 'Revisá los números de la multiplicación.' : 'La multiplicación está bien. Revisá el total.';
  } else if (q.kind === 'num' || q.kind === 'opnum') {
    if (q.kind === 'opnum' && !q.opDone) { showFb('info', 'Primero elegí el cálculo.'); return; }
    const r = val('res');
    if (r == null) { showFb('info', 'Escribí el resultado.'); return; }
    ok = r === q.answer;
    $('#res').classList.add(ok ? 'right' : 'wrong');
    partial = 'Ese no es el resultado.';
  } else if (q.kind === 'choice') {
    const sel = $('#area .choice.sel');
    if (!sel) return;
    ok = q.options[+sel.dataset.k].ok;
    sel.classList.remove('sel'); sel.classList.add(ok ? 'right' : 'wrong');
    if (!ok) sel.disabled = true;
    partial = 'Ese no es.';
  } else if (q.kind === 'multi') {
    const btns = [...document.querySelectorAll('#area .choice')];
    const chosen = btns.filter(b => b.classList.contains('sel'));
    if (!chosen.length) { showFb('info', 'Tocá al menos uno.'); return; }
    ok = btns.every(b => b.classList.contains('sel') === q.options[+b.dataset.k].ok);
    const wrongPicked = chosen.some(b => !q.options[+b.dataset.k].ok);
    partial = wrongPicked ? 'Elegiste alguno que no sirve.' : 'Te falta alguno que también sirve.';
    if (ok || tries >= 1) {
      btns.forEach(b => {
        const good = q.options[+b.dataset.k].ok, sel = b.classList.contains('sel');
        b.classList.remove('sel');
        const cls = good ? (sel ? 'right' : 'missed') : (sel ? 'wrong' : '');
        if (cls) b.classList.add(cls);
      });
    }
  }
  tries++;
  if (ok) return finish(tries === 1 && !q.opMiss ? 'ok' : 'meh',
    tries === 1 && !q.opMiss ? pick(['¡Muy bien!', '¡Excelente!', '¡Genial!', '¡Perfecto!']) : '¡Ahora sí!');
  if (tries >= 2) return finish('miss', 'Esta vez no salió. Mirá cómo se resuelve:');
  showFb('no', partial + ' Probá otra vez.');
  if (!$('#hint').classList.contains('show')) { $('#hint').classList.add('show'); $('#hintBtn').disabled = true; }
}

function finish(result, msg) {
  finished = true;
  results[idx] = result;
  showFb(result === 'miss' ? 'no' : 'ok', msg, q.why);
  if (result === 'miss' && q.kind === 'mult') {
    $('#f1').value = q.g; $('#f2').value = q.e; $('#res').value = q.g * q.e;
  }
  if ((result === 'miss') && (q.kind === 'num' || q.kind === 'opnum') && $('#res')) $('#res').value = q.answer;
  document.querySelectorAll('#area input').forEach(i => i.readOnly = true);
  if (result === 'miss' && q.kind === 'choice') document.querySelectorAll('#area .choice').forEach(b => { if (q.options[+b.dataset.k].ok) b.classList.add('missed'); });
  document.querySelectorAll('#area .choice').forEach(b => b.disabled = true);
  $('#checkBtn').style.display = 'none';
  const nb = $('#nextBtn'); nb.style.display = '';
  nb.textContent = idx < PER_LEVEL - 1 ? 'Siguiente →' : 'Ver resultado ★';
  nb.focus();
  if (result === 'ok') { const m = $('#mascot'); m.classList.remove('jump'); void m.offsetWidth; m.classList.add('jump'); }
  // refresh dots
  const dots = document.querySelectorAll('.dots span');
  dots[idx].className = result === 'ok' ? 'ok' : 'meh';
}

function levelDone() {
  const s = starsFor(results);
  best[level] = Math.max(best[level] || 0, s); saveBest();
  drawLevels();
  const ok = results.filter(r => r === 'ok').length;
  const card = $('#card'); card.innerHTML = '';
  const d = h('div', 'done');
  d.appendChild(h('div', 'big-stars', '★'.repeat(s) + '☆'.repeat(3 - s)));
  d.appendChild(h('h2', '', s === 3 ? '¡Nivel superado!' : s === 2 ? '¡Muy bien!' : '¡Buen intento!'));
  d.appendChild(h('p', '', `Acertaste ${ok} de ${PER_LEVEL} a la primera.`));
  const row = h('div', 'actions');
  const again = h('button', 'alt', '↻ Repetir nivel'); again.onclick = () => startLevel(level);
  row.appendChild(again);
  if (level < LEVELS.length - 1) {
    const nx = h('button', 'go', `Nivel ${level + 2} →`); nx.onclick = () => startLevel(level + 1);
    row.appendChild(nx);
  } else {
    d.appendChild(h('p', '', '¡Terminaste todos los niveles de la Misión 1! 🚀'));
  }
  d.appendChild(row);
  card.appendChild(d);
  const m = $('#mascot'); m.classList.remove('jump'); void m.offsetWidth; m.classList.add('jump');
}

// ---------- tabla pitagórica ----------
(function () {
  const tb = $('#ptable');
  for (let i = 0; i <= 10; i++) {
    const tr = h('tr');
    for (let j = 0; j <= 10; j++) {
      const td = h('td', '', i === 0 && j === 0 ? '×' : i === 0 ? j : j === 0 ? i : i * j);
      td.dataset.r = i; td.dataset.c = j;
      tr.appendChild(td);

      const i = +x.dataset.r, j = +x.dataset.c;
      x.className = i === r && j === c ? 'hit' : i === r && j === 0 ? 'rh' : j === c && i === 0 ? 'ch'
        : i === r && j > 0 ? 'row' : j === c && i > 0 ? 'col' : '';
    });
    $('#readout').innerHTML = `fila del <b>${r}</b>, columna del <i>${c}</i>: <b>${r}</b> × <i>${c}</i> = <em>${r * c}</em>`;
  });
  $('#tableBtn').onclick = () => {
    const open = $('#tableBox').classList.toggle('open');
    $('#tableBtn').textContent = open ? '✕ Tabla' : '🔢 Tabla';
  };
})();

// ---------- video ----------
$('#videoBtn').onclick = () => {
  const box = $('#videoBox'), open = box.classList.toggle('open');
  $('#videoBtn').textContent = open ? '✕ Cerrar video' : '▶ Video';
  if (!open) $('video', box).pause();
};

startLevel(0);
</script>
</body>
